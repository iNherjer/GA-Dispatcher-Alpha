name = "ga-proxy"
main = "worker-merged-full.js"
compatibility_date = "2026-04-16"
compatibility_flags = ["nodejs_compat"]

[vars]
OBSTACLE_TILES_BASE = "https://raw.githubusercontent.com/iNherjer/GA-Dispatcher-Alpha/main/obstacles/tiles"
OBSTACLE_CORE_TILES_BASE = "https://raw.githubusercontent.com/iNherjer/GA-Dispatcher-Alpha/main/obstacles/core-tiles"
OBSTACLE_POI_TILES_BASE = "https://raw.githubusercontent.com/iNherjer/GA-Dispatcher-Alpha/main/obstacles/poi-tiles"
BUG_REPORT_NOTIFY_SUBJECT_PREFIX = "[GA Dispatcher]"

# Wichtig:
# - GA_SYNC_KV muss als KV Binding vorhanden sein (Dashboard oder wrangler.toml).
# - Beispiel (falls ihr die ID habt):
[[kv_namespaces]]
binding = "GA_SYNC_KV"
id = "359fbc81dd0548bbba7e27eba4e513c5"

[[durable_objects.bindings]]
name = "GA_PROFILE_SYNC"
class_name = "ProfileSync"

[[durable_objects.bindings]]
name = "GA_FLIGHT_LOGBOOK"
class_name = "FlightLogbook"

[[durable_objects.bindings]]
name = "GA_CREW_PRESENCE"
class_name = "CrewPresence"

[[durable_objects.bindings]]
name = "GA_TESTBOARD"
class_name = "TestBoard"

[[migrations]]
tag = "profile-sync-v1"
new_sqlite_classes = ["ProfileSync"]

[[migrations]]
tag = "flight-logbook-v1"
new_sqlite_classes = ["FlightLogbook"]

[[migrations]]
tag = "crew-presence-v1"
new_sqlite_classes = ["CrewPresence"]

[[migrations]]
tag = "testboard-v1"
new_sqlite_classes = ["TestBoard"]
