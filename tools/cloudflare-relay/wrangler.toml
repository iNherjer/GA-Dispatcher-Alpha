name = "ga-relay"
main = "relay-worker.js"
compatibility_date = "2026-08-13"

[[durable_objects.bindings]]
name = "RELAY_ROOMS"
class_name = "RelayRoom"

[[durable_objects.bindings]]
name = "CREW_LIVE_ROOMS"
class_name = "CrewLiveRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["CrewLiveRoom"]

[observability.logs]
enabled = true
invocation_logs = true
