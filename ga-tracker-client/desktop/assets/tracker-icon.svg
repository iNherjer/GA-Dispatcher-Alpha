<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">VFR Multitool Tracker</title>
  <desc id="desc">A white aircraft over a blue live-tracking radar.</desc>
  <defs>
    <linearGradient id="background" x1="72" y1="44" x2="440" y2="468" gradientUnits="userSpaceOnUse">
      <stop stop-color="#123a5c"/>
      <stop offset="0.52" stop-color="#0b2238"/>
      <stop offset="1" stop-color="#071522"/>
    </linearGradient>
    <linearGradient id="edge" x1="90" y1="66" x2="416" y2="452" gradientUnits="userSpaceOnUse">
      <stop stop-color="#82d4ff"/>
      <stop offset="0.48" stop-color="#3aaee9"/>
      <stop offset="1" stop-color="#1975ad"/>
    </linearGradient>
    <radialGradient id="sweep" cx="0" cy="0" r="1" gradientTransform="translate(256 256) rotate(-45) scale(206)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#61e6a7" stop-opacity="0.38"/>
      <stop offset="0.62" stop-color="#54b8ff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#54b8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="15" stdDeviation="13" flood-color="#020a10" flood-opacity="0.55"/>
    </filter>
    <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="12" y="12" width="488" height="488" rx="116" fill="url(#background)"/>
  <rect x="20" y="20" width="472" height="472" rx="108" fill="none" stroke="url(#edge)" stroke-width="10"/>
  <path d="M256 256 405 107A211 211 0 0 1 467 256Z" fill="url(#sweep)"/>

  <g fill="none" stroke="#69c6fa" stroke-linecap="round">
    <circle cx="256" cy="256" r="176" stroke-width="5" stroke-opacity="0.42"/>
    <circle cx="256" cy="256" r="116" stroke-width="4" stroke-opacity="0.3"/>
    <circle cx="256" cy="256" r="56" stroke-width="4" stroke-opacity="0.24"/>
    <path d="M256 76V436M76 256H436" stroke-width="4" stroke-opacity="0.2"/>
    <path d="M132 380C170 352 196 330 219 296" stroke="#61e6a7" stroke-width="11" stroke-dasharray="2 25" stroke-opacity="0.95"/>
  </g>

  <g filter="url(#glow)">
    <circle cx="119" cy="389" r="22" fill="#61e6a7" fill-opacity="0.18"/>
    <circle cx="119" cy="389" r="11" fill="#61e6a7" stroke="#d6ffe9" stroke-width="4"/>
  </g>

  <g filter="url(#shadow)" transform="rotate(40 270 238)">
    <path d="M256 76C270 76 279 91 279 113V216L390 284V315L278 278V370L326 408V432L256 410 186 432V408L234 370V278L122 315V284L233 216V113C233 91 242 76 256 76Z" fill="#edf8ff" stroke="#8ed9ff" stroke-width="8" stroke-linejoin="round"/>
    <path d="M256 99V385" fill="none" stroke="#b9e7ff" stroke-width="6" stroke-linecap="round" opacity="0.72"/>
  </g>

  <circle cx="256" cy="256" r="8" fill="#ffffff"/>
</svg>
